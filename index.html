    <script>
        const posts = [
            {
                id: 1,
                title: "Building BYBOT: What I Learned Automating My Own Chaos",
                date: "July 2026",
                excerpt: "I didn't set out to build an AI bot. I set out to stop answering the same three questions every single day.",
                body: `I didn't set out to build an AI bot. I set out to stop answering the same three questions every single day.

That's usually how my projects start — not with a grand plan, but with me getting tired of doing something manually at 1am and thinking, "this should just... happen on its own."

<h2>The problem</h2>

Repetitive tasks were eating my day in small, invisible bites. Same messages, same responses, same manual follow-ups. None of it was hard. All of it was death by a thousand cuts. I needed something that could sit in the background, understand what was being asked, and respond intelligently — without me babysitting it.

Enter BYBOT: an AI-powered bot system built to automate responses and handle repetitive interactions so I could actually focus on building instead of replying.

<h2>Why Python</h2>

For anything touching AI/ML and automation, Python is still my default. The ecosystem is mature, the libraries are forgiving, and I can go from "idea" to "working prototype" without fighting the language itself. When you're building solo and moving fast, that matters more than people give it credit for.

The architecture is intentionally simple:
- A listener layer that catches incoming triggers
- A processing layer that figures out intent
- A response layer that handles the automated reply or hands off to a human when it's out of its depth

Nothing fancy. Fancy breaks. Simple survives 3am debugging sessions.

<h2>The part that broke spectacularly</h2>

Automated systems are great right up until they automate the wrong thing. Early on, BYBOT was a little too eager to respond — it would fire off replies to things that needed a human touch, or misread context and answer the wrong question entirely.

The fix wasn't more AI. It was less confidence. I added a threshold: if the bot wasn't reasonably sure what was being asked, it would flag it instead of guessing. Better to say "let me get back to you" than to confidently say the wrong thing.

That's a lesson that shows up in every automation project, not just this one — the goal isn't to remove humans from the loop, it's to remove humans from the <em>boring parts</em> of the loop.

<h2>Automate the boring stuff so you can code the fun stuff</h2>

That's really the whole philosophy behind BYBOT, and honestly behind most of what I build. I'm one person juggling client work, side projects, and whatever's currently on fire. If a bot can take repetitive communication off my plate, that's hours back for actual engineering — the kind of work that doesn't run on autopilot and shouldn't.

BYBOT isn't trying to be clever. It's trying to buy me time. So far, it's working.

<hr>

<em>Built with Python, deployed as part of an ongoing automation stack. More write-ups on the AI/ML side coming soon.</em>`
            },
            {
                id: 2,
                title: "Coffee, Chaos, and Commits: A Week in the Life of a Solo Full-Stack Dev",
                date: "June 2026",
                excerpt: "My bio says \"codes until 3am.\" People assume that's a joke. It's not — it's a scheduling decision.",
                body: `My bio says "codes until 3am." People assume that's a joke. It's not — it's a scheduling decision.

Here's what an actual week looks like when you're one person building banking systems, resort platforms, AI bots, and a crypto dashboard at the same time.

<h2>Monday: Context switching is the real skill</h2>

Nobody talks about this enough — the hardest part of full-stack work isn't React or PHP or Supabase. It's switching between four completely different mental models in the same day.

Morning: I'm deep in Payatas Ledger, thinking about role-based access for barangay staff. By afternoon I'm in Dropler's billing logic, thinking about what happens when a free-plan user tries to sneak past their limits. By evening I'm back in OBS, double-checking transaction security because it's a banking system and there is zero room for "close enough."

Every project has its own rules. The skill isn't knowing all the stacks — it's not bleeding one project's assumptions into another.

<h2>Tuesday: The 3am window is real, and it's not about hustle</h2>

I'm not coding at 3am because I think it's impressive. I'm coding at 3am because that's when the notifications stop, the client Slack goes quiet, and nobody needs anything from me. It's the one stretch of the day where a bug and I can just sit with each other until it makes sense.

That's when RAVI's booking calendar logic finally clicked. That's when I found the query that was silently slowing down HRVD Garage's inventory lookups. Late nights aren't a grind flex — they're just honest silence.

<h2>Wednesday: Old stack, new stack, whatever the job needs</h2>

Some of my projects run on Next.js and Tailwind. Others run on plain PHP and MySQL. I don't have a religion about it. RM Garage, OBS, and RAVI are all PHP/MySQL, and they work exactly as well as they need to. Nobody's inventory system needs a JavaScript framework to track oil changes.

Picking tools based on what the project needs — not what looks good on a portfolio — is a quietly underrated skill. It also means I ship faster, because I'm not relearning a stack mid-project just to keep up appearances.

<h2>Thursday: Debugging is 90% narrowing, 10% fixing</h2>

Most of my actual "coding" time isn't writing new code. It's narrowing down where things went wrong. Was it the query? The API response? A state update that fired before the data was ready? By the time I find the actual bug, the fix is usually three lines. Getting there is the whole job.

<h2>Friday: Ship something, even if it's small</h2>

I try to end every week having shipped <em>something</em> — a feature, a fix, a cleaner UI pass. It doesn't have to be big. Momentum matters more than magnitude. A week where nothing moved forward is a week I have to catch up on later, and I'd rather not.

<h2>The environment, honestly</h2>

There's no team standup, no Jira board, no manager checking in. It's me, a stack of projects at different stages, and a self-imposed deadline for each one. That sounds chaotic because it is — but it's chaos I've built a rhythm around. Coffee in the morning, quiet in the evening, and a commit history that doesn't lie about how the week actually went.

That's the job. Chaos, managed.`
            },
            {
                id: 3,
                title: "From Barangay Paperwork to Web App: Building Payatas Ledger",
                date: "May 2026",
                excerpt: "Most of my projects start because I got tired of doing something manually. Payatas Ledger started because I watched other people get tired of doing something manually.",
                body: `Most of my projects start because I got tired of doing something manually. Payatas Ledger started because I watched other people get tired of doing something manually — and theirs involved actual paper, actual queues, and actual government stamps.

<h2>The problem wasn't technical, it was operational</h2>

Payatas Ledger is a civic management system built for Barangay Payatas in Quezon City. Before it, day-to-day barangay operations ran on the stuff local government has run on forever: paper logs, in-person requests, manual tracking of complaints and projects. It works, technically. It's just slow, easy to lose track of, and hard on both staff and residents.

The brief was straightforward on paper and genuinely hard in practice: digitize resident management, document requests, complaints tracking, project monitoring, and announcements — all with proper role-based access, because not everyone should be able to see or touch everything.

<h2>Why Supabase</h2>

For a project like this, I wanted a backend that handled auth and role-based access without me hand-rolling a permissions system from scratch. Supabase gave me that — real-time database, built-in auth, and row-level security policies that map cleanly onto "barangay staff can do X, residents can do Y, admins can do Z."

The stack stayed intentionally lean: HTML5, CSS3, and JavaScript on the front end, Supabase doing the heavy lifting on the back. No framework overhead for a system that needed to be fast, reliable, and maintainable by people who aren't going to be deep in a JS ecosystem long-term.

<h2>The hard part wasn't the code</h2>

Building a login system and a database table for complaints — that part's normal full-stack work. The actually hard part was designing for people who didn't ask for a digital system and aren't necessarily comfortable with one.

Barangay staff needed something that didn't feel like a leap from the paper process they already understood. Residents requesting documents needed a flow simple enough that "how do I even use this" wasn't the first question. Every screen had to answer "what do I do next" without a manual.

That meant:
- Plain-language labels instead of technical ones (no "submit ticket," just "file a complaint")
- Status tracking that mirrors how people already think about requests — "pending," "in review," "released" — not developer jargon
- Role-based views that hide complexity instead of just restricting access, so staff aren't staring at features they'll never touch

<h2>Digitizing without disconnecting</h2>

The goal was never to make Payatas operations feel like a tech startup. It was to take a process people already understood and remove the friction — the lost forms, the repeat trips, the "come back tomorrow." Reports, announcements, and project monitoring all live in one place now, with an audit trail that paper never gave anyone.

<h2>What this project taught me</h2>

Building for people who aren't tech-savvy is a different discipline than building for developers or power users. You can't lean on clever UI patterns or assume familiarity with anything. Every choice has to answer one question honestly: does this make someone's day easier, or does it just make the system look more impressive?

Payatas Ledger isn't the flashiest thing in my portfolio. It's one of the ones I'm proudest of, because the people using it aren't measuring it by design trends — they're measuring it by whether the line at the barangay hall got shorter.`
            }
        ];

        const blogGrid = document.getElementById('blogGrid');
        const postList = document.getElementById('postList');
        const postDetail = document.getElementById('postDetail');
        const postDetailTitle = document.getElementById('postDetailTitle');
        const postDetailBody = document.getElementById('postDetailBody');

        function renderPosts() {
            blogGrid.innerHTML = posts.map(post => `
                <article class="blog-card" data-id="${post.id}">
                    <div class="blog-card-date">${post.date}</div>
                    <h3 class="blog-card-title">${post.title}</h3>
                    <p class="blog-card-excerpt">${post.excerpt}</p>
                </article>
            `).join('');

            document.querySelectorAll('.blog-card').forEach(card => {
                card.addEventListener('click', () => {
                    const id = parseInt(card.dataset.id);
                    openPost(id);
                });
            });
        }

        function openPost(id) {
            const post = posts.find(p => p.id === id);
            if (!post) return;

            postDetailTitle.textContent = post.title;
            postDetailBody.innerHTML = post.body;

            postList.classList.add('hidden');
            postDetail.classList.add('active');

            window.scrollTo({ top: document.getElementById('blog').offsetTop - 20, behavior: 'smooth' });
        }

        function closePost() {
            postDetail.classList.remove('active');
            postList.classList.remove('hidden');
            window.scrollTo({ top: document.getElementById('blog').offsetTop - 20, behavior: 'smooth' });
        }

        document.getElementById('postBack').addEventListener('click', closePost);
        document.getElementById('postBackBottom').addEventListener('click', closePost);

        renderPosts();
    </script>

</body>
